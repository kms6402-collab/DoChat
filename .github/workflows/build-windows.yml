name: Build Windows exe

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 빌드 정보 생성 (버전에 커밋/날짜 반영)
        run: python scripts\generate_build_info.py

      - name: PyInstaller로 exe 빌드
        run: |
          pyinstaller --windowed --onefile --name DoChat --icon assets\icon.ico --add-data "assets;assets" main.py

      - name: 빌드 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: DoChat-windows-exe
          path: dist/DoChat.exe
          if-no-files-found: error

      - name: GitHub Release에 첨부 (태그 푸시 시)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DoChat.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
